version: "3.9"

services:
  # ─────────── MariaDB ───────────
  db:
    image: mariadb:11.2
    container_name: personnel_news_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-personnel_news}
      MYSQL_USER: ${DB_USER:-newsbot}
      MYSQL_PASSWORD: ${DB_PASSWORD:-newspass}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────── 크롤러 + 텔레그램 봇 ───────────
  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: personnel_news_crawler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-personnel_news}
      DB_USER: ${DB_USER:-newsbot}
      DB_PASSWORD: ${DB_PASSWORD:-newspass}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      CRON_HOUR: ${CRON_HOUR:-*/1}
      CRON_MINUTE: ${CRON_MINUTE:-0}
    volumes:
      - ./crawler:/app
    command: python scheduler/scheduler.py

  # ─────────── FastAPI 백엔드 ───────────
  backend:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: personnel_news_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-personnel_news}
      DB_USER: ${DB_USER:-newsbot}
      DB_PASSWORD: ${DB_PASSWORD:-newspass}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - ./crawler:/app
      - ./backend:/backend
    working_dir: /backend
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  # ─────────── React 프론트엔드 ───────────
  frontend:
    image: node:20-alpine
    container_name: personnel_news_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  db_data:
